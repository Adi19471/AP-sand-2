<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1D4ED8" />
    <meta
      name="description"
      content="AP SAND - Sand Management System. Generate, track and report sand dispatch receipts."
    />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Poppins for the interface; Courier Prime for the receipt slip (so it
         prints the same on a phone as on a desktop); the condensed face is for
         the QR verification page title (/v/:token). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Courier+Prime:wght@400;700&family=Roboto+Condensed:wght@700;800&display=swap"
    />
    <title>AP SAND | Sand Management System</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <img class="boot-mark" src="/ap-emblem.png" alt="Andhra Pradesh emblem" />
        <p>Loading AP SAND Management System&hellip;</p>
      </div>
    </div>
    <!-- A scanned receipt (/v/:token) boots behind the sand logo instead: the
         same screen LogoLoading (components/Loading.jsx) shows while the
         details load, so the two run together. -->
    <script>
      if (location.pathname.indexOf('/v/') === 0) {
        document.getElementById('root').innerHTML =
          '<div class="logo-loading"><img class="logo-loading__mark" src="/sand-logo.jpg" alt="" /><span>Loading details&hellip;</span></div>';
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
