<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e6"/>
      <stop offset="0.55" stop-color="#f6e8cf"/>
      <stop offset="1" stop-color="#efd9b3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.08" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1dcb4"/>
      <stop offset="1" stop-color="#e6c893"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebcf9d"/>
      <stop offset="1" stop-color="#dcb67a"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2be83"/>
      <stop offset="1" stop-color="#cfa463"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- wind ripples across the open sand -->
  <g fill="none" stroke="#e3c896" stroke-opacity="0.38" stroke-width="2">
    <path d="M-40 250 C 240 210 520 280 820 244 S 1340 214 1640 262"/>
    <path d="M-40 290 C 260 252 540 318 840 284 S 1360 256 1640 302"/>
    <path d="M-40 420 C 220 384 500 446 780 414 S 1300 380 1640 430"/>
    <path d="M-40 458 C 240 424 520 484 800 452 S 1320 420 1640 468"/>
    <path d="M-40 580 C 260 548 560 606 860 574 S 1380 546 1640 590"/>
  </g>

  <!-- dunes rising at the foot of the page -->
  <path d="M0 720 C 220 660 440 700 660 724 S 1040 780 1260 716 S 1500 668 1600 700 V1000 H0 Z" fill="url(#a)"/>
  <path d="M0 720 C 220 660 440 700 660 724 S 1040 780 1260 716 S 1500 668 1600 700" fill="none" stroke="#fff6e2" stroke-opacity="0.8" stroke-width="3"/>

  <path d="M0 810 C 260 752 520 836 800 800 S 1280 738 1600 812 V1000 H0 Z" fill="url(#b)"/>
  <path d="M0 810 C 260 752 520 836 800 800 S 1280 738 1600 812" fill="none" stroke="#fbe9c6" stroke-opacity="0.7" stroke-width="3"/>

  <path d="M0 900 C 300 846 640 932 960 886 S 1400 852 1600 906 V1000 H0 Z" fill="url(#c)"/>
  <path d="M0 900 C 300 846 640 932 960 886 S 1400 852 1600 906" fill="none" stroke="#f3d9a8" stroke-opacity="0.65" stroke-width="3"/>
</svg>
